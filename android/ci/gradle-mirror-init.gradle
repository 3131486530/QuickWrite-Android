// CI 专用 Gradle 初始化脚本（仅在工作流里安装到 ~/.gradle/init.d，不参与本地构建）
//
// Maven Central 对 GitHub 共享出口 IP 会周期性返回 429 Too Many Requests，
// 直接导致插件与依赖解析失败（三项 Flutter 插件体系一启动就去拉 kotlin-stdlib）。
// 这里把可用的公共镜像前置，官方仓库保留在末尾兜底。

def MIRRORS = [
    // Google 官方托管的 Maven Central 镜像，GitHub runner 访问稳定
    'https://maven-central.storage-download.googleapis.com/maven2/',
    // 阿里云公共聚合仓，境外访问较慢但覆盖全
    'https://maven.aliyun.com/repository/public',
    'https://maven.aliyun.com/repository/google',
]

settingsEvaluated { settings ->
    settings.pluginManagement.repositories { RepositoryHandler handler ->
        handler.clear()
        MIRRORS.each { String u -> handler.maven { url = uri(u) } }
        handler.gradlePluginPortal()
        handler.mavenCentral()
        handler.google()
    }
    try {
        settings.dependencyResolutionManagement.repositories { RepositoryHandler handler ->
            handler.clear()
            MIRRORS.each { String u -> handler.maven { url = uri(u) } }
            handler.google()
            handler.mavenCentral()
        }
    } catch (ignored) {
        // 未启用 dependencyResolutionManagement 的项目忽略即可
    }
}

gradle.allprojects { project ->
    project.buildscript.repositories { RepositoryHandler handler ->
        handler.clear()
        MIRRORS.each { String u -> handler.maven { url = uri(u) } }
        handler.google()
        handler.mavenCentral()
        handler.gradlePluginPortal()
    }
    project.repositories { RepositoryHandler handler ->
        handler.clear()
        MIRRORS.each { String u -> handler.maven { url = uri(u) } }
        handler.google()
        handler.mavenCentral()
    }
}
